name: Maven Package & Auto-Release

on:
  push:
    branches: [ "master" ]

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Pulls all history for proper tagging

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          server-id: github
          settings-path: ${{ github.workspace }}

      - name: Build with Maven
        # Uses the unique run number to version the build
        run: mvn -B package -Drevision=1.0.${{ github.run_number }} --file pom.xml -DskipTests

      - name: Create or Update Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Generate a unique tag based on the build number
          AUTO_TAG="v1.0.${{ github.run_number }}"
          
          echo "Creating automated release for tag: $AUTO_TAG"
          
          gh release create "$AUTO_TAG" \
            --title "Release $AUTO_TAG" \
            --notes "Automated release from master branch push." \
            --target master \
            target/flink-transaction-processor-job-latest.jar